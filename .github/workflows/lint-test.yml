name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest   # every folder in pyproject.toml's testpaths

      - name: Run benchmark harness end to end (dummy detector, synthetic frames)
        run: python testing-deployment-team/tests/eval_harness.py

      # The real model can't run here (weights and TORSO-21 aren't in git), so
      # this scores multiclass_v2's recorded detections on the held-out test
      # set against benchmarks/baseline.json, overall and per class.
      - name: Real-model regression gate (recorded multiclass_v2 detections)
        run: python testing-deployment-team/tests/eval_harness.py --recorded
